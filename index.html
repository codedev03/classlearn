                <li>• <strong>Aspirin Synthesis:</strong> Acetylation of <strong>Salicylic acid</strong> (2-hydroxybenzoic acid) with acetic anhydride (<span class="font-mono">(CH<sub>3</sub>CO)<sub>2</sub>O</span> / H<sup>+</sup>) produces <strong>Acetylsalicylic acid (Aspirin)</strong>.</li>
              </ul>
            `,
            tip: 'In esterification, the H atom comes from the alcohol/phenol (O–H cleavage) and the –OH comes from the carboxylic acid!'
          }
        ]
      }
    ];

    /* -----------------------------------------------------------------------
       3. APPLICATION STATE & LOCALSTORAGE PERSISTENCE
       ----------------------------------------------------------------------- */
    let appState = {
      decks: JSON.parse(JSON.stringify(DEFAULT_DECKS)),
      masteredIds: [],
      activeDeckId: null,
      activeCardIdx: 0,
      isFlipped: false,
      currentMode: 'card', // 'card' | 'sandbox'
    };

    function loadState() {
      try {
        const savedMastered = localStorage.getItem('unit11_mastered_ids');
        if (savedMastered) appState.masteredIds = JSON.parse(savedMastered);

        const savedCustomCards = localStorage.getItem('unit11_custom_cards');
        if (savedCustomCards) {
          const parsed = JSON.parse(savedCustomCards);
          if (parsed.customDeckCards && parsed.customDeckCards.length > 0) {
            ensureCustomDeck().cards = parsed.customDeckCards;
          }
          if (parsed.injectedByDeck) {
            Object.entries(parsed.injectedByDeck).forEach(([deckId, cards]) => {
              const target = appState.decks.find(d => d.id === deckId);
              if (target) target.cards.push(...cards);
            });
          }
        }
      } catch (e) {
        console.warn('Storage load fallback:', e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem('unit11_mastered_ids', JSON.stringify(appState.masteredIds));
      } catch (e) {}
    }

    function ensureCustomDeck() {
      let customDeck = appState.decks.find(d => d.id === 'custom');
      if (!customDeck) {
        customDeck = {
          id: 'custom',
          number: 'Custom Deck',
          title: 'My Uploaded Study Notes',
          subtitle: 'Auto-generated flashcards from your pasted notes & PDF excerpts',
          badgeBg: 'bg-indigo-100',
          badgeText: 'text-indigo-900',
          accentColor: '#4F46E5',
          cards: []
        };
        appState.decks.push(customDeck);
      }
      return customDeck;
    }

    /* -----------------------------------------------------------------------
       4. TOAST FEEDBACK HELPER
       ----------------------------------------------------------------------- */
    let toastTimeout;
    function showToast(msg, dotColor = 'bg-emerald-400') {
      const banner = document.getElementById('toast-banner');
      const messageEl = document.getElementById('toast-message');
      messageEl.innerHTML = `<span class="w-2.5 h-2.5 rounded-full ${dotColor}"></span><span>${msg}</span>`;
      banner.classList.remove('opacity-0', 'translate-y-4');
      banner.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        banner.classList.add('opacity-0', 'translate-y-4');
        banner.classList.remove('opacity-100', 'translate-y-0');
      }, 2400);
    }

    /* -----------------------------------------------------------------------
       5. VIEW 1: STUDY HUB RENDERING & SPRING PHYSICS TILT
       ----------------------------------------------------------------------- */
    function renderHub() {
      const grid = document.getElementById('decks-grid');
      grid.innerHTML = '';

      let totalCards = 0;
      let totalMastered = 0;

      appState.decks.forEach(deck => {
        const deckTotal = deck.cards.length;
        const deckMastered = deck.cards.filter(c => appState.masteredIds.includes(c.id)).length;
        totalCards += deckTotal;
        totalMastered += deckMastered;
        const pct = deckTotal > 0 ? Math.round((deckMastered / deckTotal) * 100) : 0;

        const hasSandbox = deck.cards.some(c => Boolean(c.sandboxType));

        const cardEl = document.createElement('div');
        cardEl.className = 'deck-card bg-white/95 backdrop-blur-md rounded-3xl p-6 border border-slate-200/90 shadow-sm cursor-pointer flex flex-col justify-between';
        cardEl.onclick = () => openDeck(deck.id);

        cardEl.innerHTML = `
          <div>
            <div class="flex items-center justify-between gap-2 mb-3.5">
              <span class="text-xs font-extrabold uppercase tracking-wider px-3 py-1 rounded-full ${deck.badgeBg} ${deck.badgeText}">
                ${deck.number}
              </span>
              <div class="flex items-center gap-2">
                ${hasSandbox ? `<span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900">🧪 Interactive Lab</span>` : ''}
                <span class="text-xs font-mono font-bold text-slate-500">${deckTotal} Cards</span>
              </div>
            </div>
            <h4 class="text-xl font-extrabold text-slate-900 mb-1.5 group-hover:text-indigo-600 transition">${deck.title}</h4>
            <p class="text-sm text-slate-600 leading-relaxed mb-5">${deck.subtitle}</p>
          </div>

          <div>
            <div class="flex items-center justify-between text-xs font-bold mb-1.5">
              <span class="text-slate-500">${deckMastered} / ${deckTotal} Mastered</span>
              <span class="font-mono text-slate-800">${pct}%</span>
            </div>
            <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
              <div class="h-full rounded-full transition-all duration-500" style="width: ${pct}%; background-color: ${deck.accentColor}"></div>
            </div>
          </div>
        `;

        // Spring-Physics 3D Tilt on Hover
        cardEl.addEventListener('mousemove', (e) => {
          const rect = cardEl.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width - 0.5;
          const y = (e.clientY - rect.top) / rect.height - 0.5;
          cardEl.style.transform = `perspective(1000px) rotateX(${(-y * 7).toFixed(2)}deg) rotateY(${(x * 7).toFixed(2)}deg) translateY(-4px)`;
        });
        cardEl.addEventListener('mouseleave', () => {
          cardEl.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)';
        });

        grid.appendChild(cardEl);
      });

      const overallPct = totalCards > 0 ? Math.round((totalMastered / totalCards) * 100) : 0;
      document.getElementById('overall-mastery-pct').textContent = `${overallPct}%`;
      document.getElementById('overall-mastery-bar').style.width = `${overallPct}%`;
      document.getElementById('overall-mastery-count').textContent = `${totalMastered} of ${totalCards} cards mastered`;
    }

    function goHome() {
      cleanupThreeMolecule();
      appState.activeDeckId = null;
      document.getElementById('view-deck').classList.add('hidden');
      document.getElementById('view-hub').classList.remove('hidden');
      renderHub();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetProgress() {
      appState.masteredIds = [];
      saveState();
      renderHub();
      showToast('Mastery progress cleared', 'bg-amber-400');
    }

    /* -----------------------------------------------------------------------
       6. VIEW 2: ACTIVE DECK, CARD FLIP, NAVIGATION & SWIPE PHYSICS
       ----------------------------------------------------------------------- */
    function openDeck(deckId) {
      const deck = appState.decks.find(d => d.id === deckId);
      if (!deck || deck.cards.length === 0) return;

      appState.activeDeckId = deckId;
      appState.activeCardIdx = 0;
      appState.isFlipped = false;
      appState.currentMode = 'card';

      document.getElementById('view-hub').classList.add('hidden');
      document.getElementById('view-deck').classList.remove('hidden');

      const badge = document.getElementById('active-deck-badge');
      badge.className = `text-xs font-extrabold uppercase tracking-wider px-3 py-0.5 rounded-full ${deck.badgeBg} ${deck.badgeText}`;
      badge.textContent = deck.number;
      document.getElementById('active-deck-title').textContent = deck.title;

      renderActiveCard();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderActiveCard(animDirection = null) {
      cleanupThreeMolecule();
      const deck = appState.decks.find(d => d.id === appState.activeDeckId);
      if (!deck) return;

      const card = deck.cards[appState.activeCardIdx];
      const isMastered = appState.masteredIds.includes(card.id);

      // Update Counter
      document.getElementById('card-counter').textContent = `${appState.activeCardIdx + 1} / ${deck.cards.length}`;

      // Reset Flip State
      appState.isFlipped = false;
      const inner = document.getElementById('flashcard-inner');
      inner.classList.remove('is-flipped');

      // Directional Slide Animation
      const stage = document.getElementById('flashcard-stage');
      stage.classList.remove('anim-slide-right', 'anim-slide-left');
      void stage.offsetWidth;
      if (animDirection === 'next') stage.classList.add('anim-slide-right');
      if (animDirection === 'prev') stage.classList.add('anim-slide-left');

      // Populate Front
      document.getElementById('front-tag').textContent = card.tag || 'Concept';
      document.getElementById('front-question').innerHTML = card.question;
      document.getElementById('front-visual').innerHTML = card.visual || '';

      const masteredPill = document.getElementById('front-mastered-pill');
      if (isMastered) {
        masteredPill.classList.remove('hidden');
        masteredPill.classList.add('inline-flex');
      } else {
        masteredPill.classList.add('hidden');
        masteredPill.classList.remove('inline-flex');
      }

      // Populate Back
      document.getElementById('back-answer').innerHTML = card.answer;
      const tipBox = document.getElementById('back-tip-box');
      if (card.tip) {
        tipBox.classList.remove('hidden');
        document.getElementById('back-tip-text').textContent = card.tip;
      } else {
        tipBox.classList.add('hidden');
      }

      // Sandbox Tab Controls
      const modeTabs = document.getElementById('mode-tabs-wrapper');
      const openSandboxBackBtn = document.getElementById('open-sandbox-from-back');
      if (card.sandboxType) {
        modeTabs.classList.remove('hidden');
        modeTabs.classList.add('flex');
        document.getElementById('tab-sandbox-label').textContent = card.sandboxLabel || 'Interactive Lab Sandbox';
        openSandboxBackBtn.classList.remove('hidden');
        openSandboxBackBtn.classList.add('inline-flex');
      } else {
        modeTabs.classList.add('hidden');
        modeTabs.classList.remove('flex');
        openSandboxBackBtn.classList.add('hidden');
        openSandboxBackBtn.classList.remove('inline-flex');
      }

      // Default to Flashcard view
      switchCardMode('card', false);
    }

    function flipCard() {
      appState.isFlipped = !appState.isFlipped;
      const inner = document.getElementById('flashcard-inner');
      inner.classList.toggle('is-flipped', appState.isFlipped);
    }

    function nextCard() {
      const deck = appState.decks.find(d => d.id === appState.activeDeckId);
      if (!deck) return;
      appState.activeCardIdx = (appState.activeCardIdx + 1) % deck.cards.length;
      renderActiveCard('next');
    }

    function prevCard() {
      const deck = appState.decks.find(d => d.id === appState.activeDeckId);
      if (!deck) return;
      appState.activeCardIdx = (appState.activeCardIdx - 1 + deck.cards.length) % deck.cards.length;
      renderActiveCard('prev');
    }

    function setMastery(mastered) {
      const deck = appState.decks.find(d => d.id === appState.activeDeckId);
      if (!deck) return;
      const card = deck.cards[appState.activeCardIdx];

      if (mastered) {
        if (!appState.masteredIds.includes(card.id)) {
          appState.masteredIds.push(card.id);
        }
        showToast('Marked as Mastered! Moving next...', 'bg-emerald-400');
        saveState();
        setTimeout(() => nextCard(), 350);
      } else {
        appState.masteredIds = appState.masteredIds.filter(id => id !== card.id);
        saveState();
        renderActiveCard();
        showToast('Kept in Review Queue', 'bg-amber-400');
      }
    }

    function switchCardMode(mode, renderSandbox = true) {
      appState.currentMode = mode;
      const flashcardStage = document.getElementById('flashcard-stage');
      const sandboxStage = document.getElementById('sandbox-stage');
      const btnCard = document.getElementById('tab-btn-card');
      const btnSandbox = document.getElementById('tab-btn-sandbox');

      if (mode === 'card') {
        cleanupThreeMolecule();
        flashcardStage.classList.remove('hidden');
        sandboxStage.classList.add('hidden');
        btnCard.className = 'px-4 py-2 rounded-xl text-sm font-bold transition bg-indigo-600 text-white shadow-xs';
        btnSandbox.className = 'px-4 py-2 rounded-xl text-sm font-bold transition text-slate-600 hover:text-slate-900 flex items-center gap-1.5';
      } else {
        flashcardStage.classList.add('hidden');
        sandboxStage.classList.remove('hidden');
        btnSandbox.className = 'px-4 py-2 rounded-xl text-sm font-bold transition bg-amber-500 text-white shadow-xs flex items-center gap-1.5';
        btnCard.className = 'px-4 py-2 rounded-xl text-sm font-bold transition text-slate-600 hover:text-slate-900';

        if (renderSandbox) {
          const deck = appState.decks.find(d => d.id === appState.activeDeckId);
          const card = deck.cards[appState.activeCardIdx];
          buildSandbox(card.sandboxType);
        }
      }
    }

    /* --- Sandbox 1: Boiling Point Visualizer --- */
    function setBPCompound(idx) {
      [0, 1, 2].forEach(i => {
        const btn = document.getElementById(`bp-btn-${i}`);
        if (btn) {
          btn.className = i === idx
            ? 'p-3 rounded-2xl border-2 border-indigo-600 bg-indigo-50 text-center transition'
            : 'p-3 rounded-2xl border-2 border-slate-200 bg-white text-center transition hover:border-slate-300';
        }
      });

      const data = [
        {
          name: 'Propane (CH₃CH₂CH₃)',
          mass: '44 u',
          bp: '231 K (-42 °C)',
          barPct: 35,
          barColor: 'bg-slate-400',
          force: 'Weak van der Waals (London dispersion) forces only',
          diagram: `<div class="font-mono text-sm text-center py-3 text-slate-600">CH₃–CH₂–CH₃ &nbsp;&nbsp;<span class="text-slate-400">··· weak dispersion ···</span>&nbsp;&nbsp; CH₃–CH₂–CH₃</div>`
        },
        {
          name: 'Methoxymethane (CH₃OCH₃)',
          mass: '46 u',
          bp: '248 K (-25 °C)',
          barPct: 50,
          barColor: 'bg-amber-400',
          force: 'Moderate Dipole–Dipole attraction (No O–H bond for H-bonding)',
          diagram: `<div class="font-mono text-sm text-center py-3 text-amber-900">CH₃–O<sup>δ−</sup>–CH₃ &nbsp;&nbsp;<span class="text-amber-500">··· dipole-dipole ···</span>&nbsp;&nbsp; CH₃–O<sup>δ−</sup>–CH₃</div>`
        },
        {
          name: 'Ethanol (CH₃CH₂OH)',
          mass: '46 u',
          bp: '351 K (+78 °C)',
          barPct: 95,
          barColor: 'bg-emerald-500',
          force: 'Strong Intermolecular Hydrogen Bonding (O–H···O)',
          diagram: `<div class="font-mono text-sm text-center py-3 text-emerald-950 font-bold">C₂H₅–O–H <span class="text-rose-600">······</span> O(C₂H₅)–H <span class="text-rose-600">······</span> O(C₂H₅)–H</div>`
        }
      ][idx];

    /* --- Sandbox 3: Grignard Builder --- */

    /* --- Sandbox 5: Acidity & pKa Sorter Mini-Game --- */
    const PKA_ITEMS = [
      { id: 'p-nitro', name: 'p-Nitrophenol', pka: 7.1, rank: 1 },
      { id: 'o-nitro', name: 'o-Nitrophenol', pka: 7.2, rank: 2 },
      { id: 'm-nitro', name: 'm-Nitrophenol', pka: 8.3, rank: 3 },
      { id: 'phenol', name: 'Phenol', pka: 10.0, rank: 4 },
      { id: 'p-cresol', name: 'p-Cresol', pka: 10.2, rank: 5 },
      { id: 'ethanol', name: 'Ethanol', pka: 15.9, rank: 6 }
    ];
    let pkaUserOrder = [];

    function initPkaChallenge() {
      pkaUserOrder = [];
      const shuffled = [...PKA_ITEMS].sort(() => Math.random() - 0.5);
      const poolEl = document.getElementById('pka-pool');
      poolEl.innerHTML = '';
      shuffled.forEach(item => {
        const btn = document.createElement('button');
        btn.id = `pka-chip-${item.id}`;
        btn.className = 'px-3.5 py-2 rounded-xl bg-white border-2 border-slate-200 hover:border-indigo-500 text-sm font-bold text-slate-800 transition active:scale-95';
        btn.textContent = item.name;
        btn.onclick = () => pickPkaItem(item);
        poolEl.appendChild(btn);
      });
      renderPkaRanked();
    }

    function resetPkaChallenge() {
      initPkaChallenge();
    }

    function pickPkaItem(item) {
      if (pkaUserOrder.some(x => x.id === item.id)) return;
      pkaUserOrder.push(item);
      const chip = document.getElementById(`pka-chip-${item.id}`);
      if (chip) {
        chip.disabled = true;
        chip.className = 'px-3.5 py-2 rounded-xl bg-slate-100 border-2 border-slate-100 text-sm font-bold text-slate-400 cursor-not-allowed';
      }
      renderPkaRanked();
    }

    function renderPkaRanked() {
      const listEl = document.getElementById('pka-ranked-list');
      const fbEl = document.getElementById('pka-feedback');
      if (pkaUserOrder.length === 0) {
        listEl.innerHTML = `<span class="text-xs text-slate-400 italic">Tap compounds above to build your acid-strength order...</span>`;
        fbEl.innerHTML = '';
        return;
      }

      listEl.innerHTML = pkaUserOrder.map((item, idx) => `
        <span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-bold">
          <span>#${idx + 1} ${item.name}</span>
          ${pkaUserOrder.length === PKA_ITEMS.length ? `<span class="font-mono bg-white/20 px-1.5 rounded">pKa ${item.pka}</span>` : ''}
        </span>
      `).join('<span class="text-slate-400 font-bold">&gt;</span>');

      if (pkaUserOrder.length === PKA_ITEMS.length) {
        const isCorrect = pkaUserOrder.every((item, idx) => item.rank === idx + 1);
        if (isCorrect) {
          fbEl.innerHTML = `<div class="p-3.5 rounded-xl bg-emerald-100 text-emerald-900">🎉 Spot on! Strongest acid has the lowest pK<sub>a</sub>: p-Nitrophenol (7.1) &gt; o-Nitrophenol (7.2) &gt; m-Nitrophenol (8.3) &gt; Phenol (10.0) &gt; p-Cresol (10.2) &gt; Ethanol (15.9).</div>`;
        } else {
          fbEl.innerHTML = `<div class="p-3.5 rounded-xl bg-amber-100 text-amber-900">Not quite! Remember: <strong>p-Nitrophenol (7.1)</strong> is slightly stronger than <strong>o-Nitrophenol (7.2)</strong> due to intramolecular H-bonding in o-nitrophenol, followed by <strong>m-Nitrophenol (8.3)</strong>, <strong>Phenol (10.0)</strong>, <strong>p-Cresol (10.2)</strong>, and <strong>Ethanol (15.9)</strong>.</div>`;
        }
      }
    }

    /* -----------------------------------------------------------------------
       8. THREE.JS 3D INTERACTIVE MOLECULE VIEWER (SANDBOX)
       ----------------------------------------------------------------------- */
    let molScene, molCamera, molRenderer, molGroup, molAnimId;
    let isDraggingMol = false, prevMouse = { x: 0, y: 0 }, rotVel = { x: 0.005, y: 0.01 };

    function cleanupThreeMolecule() {
      if (molAnimId) cancelAnimationFrame(molAnimId);
      molAnimId = null;
      if (molRenderer) {
        molRenderer.dispose();
        molRenderer = null;
      }
    }

    function selectMolecule3D(type) {
      ['methanol', 'phenol', 'ether'].forEach(k => {
        const btn = document.getElementById(`mol-btn-${k}`);
        if (btn) {
          btn.className = k === type
            ? 'mol-sel-btn px-4 py-2 rounded-xl text-sm font-bold bg-indigo-600 text-white transition'
            : 'mol-sel-btn px-4 py-2 rounded-xl text-sm font-bold bg-slate-100 text-slate-700 hover:bg-slate-200 transition';
        }
      });

      const statsMap = {
        methanol: `<strong>Methanol (CH₃OH):</strong> C–O bond length = <strong>142 pm</strong>, O–H bond = <strong>96 pm</strong>, C–O–H bond angle = <strong>108.9°</strong> (compressed slightly below 109.5° by oxygen's two lone pairs).`,
        phenol: `<strong>Phenol (C₆H₅OH):</strong> C–O bond length = <strong>136 pm</strong> (shorter due to resonance partial double-bond character & sp² carbon), C–O–H angle = <strong>109°</strong>.`,
        ether: `<strong>Methoxymethane (CH₃OCH₃):</strong> C–O bond length = <strong>141 pm</strong>, C–O–C bond angle = <strong>111.7°</strong> (widened above tetrahedral 109.5° due to steric repulsion between bulky methyl groups).`
      };
      const statsEl = document.getElementById('molecule-3d-stats');
      if (statsEl) statsEl.innerHTML = statsMap[type];

      const container = document.getElementById('molecule-3d-viewport');
      if (!container || typeof THREE === 'undefined') return;

      cleanupThreeMolecule();
      // Remove any old canvas
      const oldCanvas = container.querySelector('canvas');
      if (oldCanvas) oldCanvas.remove();

      const w = container.clientWidth || 600;
      const h = container.clientHeight || 290;

      molScene = new THREE.Scene();
      molCamera = new THREE.PerspectiveCamera(42, w / h, 0.1, 100);
      molCamera.position.set(0, 0.4, 6.2);

      molRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      molRenderer.setSize(w, h);
      molRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(molRenderer.domElement);

      // Lighting
      const ambient = new THREE.AmbientLight(0xffffff, 0.75);
      molScene.add(ambient);
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
      dirLight.position.set(5, 7, 6);
      molScene.add(dirLight);

      molGroup = new THREE.Group();
      molScene.add(molGroup);

      // Materials
      const matC = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.35, metalness: 0.1 });
      const matO = new THREE.MeshStandardMaterial({ color: 0xe11d48, roughness: 0.3, metalness: 0.1 });
      const matH = new THREE.MeshStandardMaterial({ color: 0xe0f2fe, roughness: 0.25 });
      const matLP = new THREE.MeshStandardMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.65, roughness: 0.2 });
      const matBond = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.4 });

      function addAtom(pos, radius, mat) {
        const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 24, 24), mat);
        mesh.position.set(...pos);
        molGroup.add(mesh);
      }

      function addBond(p1, p2, doubleBond = false) {
        const v1 = new THREE.Vector3(...p1);
        const v2 = new THREE.Vector3(...p2);
        const dir = new THREE.Vector3().subVectors(v2, v1);
        const len = dir.length();
        const mid = new THREE.Vector3().addVectors(v1, v2).multiplyScalar(0.5);

        const makeCyl = (offset = 0) => {
          const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, len, 12), matBond);
          cyl.position.copy(mid);
          if (offset) cyl.position.z += offset;
          cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
          molGroup.add(cyl);
        };

        if (doubleBond) {
          makeCyl(0.09);
          makeCyl(-0.09);
        } else {
          makeCyl(0);
        }
      }

      if (type === 'methanol') {
        const posO = [0.6, 0.3, 0];
        const posC = [-0.75, -0.1, 0];
        const posHO = [1.35, -0.35, 0];
        addAtom(posO, 0.42, matO);
        addAtom(posC, 0.46, matC);
        addAtom(posHO, 0.28, matH);
        addBond(posO, posC);
        addBond(posO, posHO);

        // 3 Methyl H atoms
        const hCoords = [[-1.3, 0.85, 0.4], [-1.3, -0.9, 0.55], [-0.85, -0.25, -1.05]];
        hCoords.forEach(hc => {
          addAtom(hc, 0.27, matH);
          addBond(posC, hc);
        });

        // 2 Oxygen Lone Pairs
        addAtom([0.75, 0.95, 0.65], 0.2, matLP);
        addAtom([0.75, 0.95, -0.65], 0.2, matLP);
      } else if (type === 'ether') {
        const posO = [0, 0.45, 0];
        const posC1 = [-1.15, -0.25, 0];
        const posC2 = [1.15, -0.25, 0];
        addAtom(posO, 0.42, matO);
        addAtom(posC1, 0.46, matC);
        addAtom(posC2, 0.46, matC);
        addBond(posO, posC1);
        addBond(posO, posC2);

        // Methyl Hydrogens
        [[-1.95, 0.45, 0.3], [-1.25, -1.15, 0.6], [-1.25, -0.5, -0.95]].forEach(hc => {
          addAtom(hc, 0.26, matH);
          addBond(posC1, hc);
        });
        [[1.95, 0.45, -0.3], [1.25, -1.15, -0.6], [1.25, -0.5, 0.95]].forEach(hc => {
          addAtom(hc, 0.26, matH);
          addBond(posC2, hc);
        });

        // Lone pairs
        addAtom([0, 1.15, 0.62], 0.19, matLP);
        addAtom([0, 1.15, -0.62], 0.19, matLP);
      } else if (type === 'phenol') {
        // Hexagon Benzene Ring
        const r = 1.25;
        const ringPts = [];
        for (let i = 0; i < 6; i++) {
          const ang = (i * Math.PI) / 3;
          ringPts.push([Math.cos(ang) * r - 0.5, Math.sin(ang) * r, 0]);
        }
        ringPts.forEach((pt, i) => {
          addAtom(pt, 0.38, matC);
          const next = ringPts[(i + 1) % 6];
          addBond(pt, next, i % 2 === 0);
          if (i !== 0) {
            const hPt = [pt[0] + Math.cos((i * Math.PI) / 3) * 0.85, pt[1] + Math.sin((i * Math.PI) / 3) * 0.85, 0];
            addAtom(hPt, 0.24, matH);
            addBond(pt, hPt);
          }
        });
        // -OH attached at index 0 (rightmost carbon)
        const c0 = ringPts[0];
        const posO = [c0[0] + 1.15, c0[1], 0];
        const posH = [posO[0] + 0.55, posO[1] + 0.72, 0];
        addAtom(posO, 0.4, matO);
        addAtom(posH, 0.26, matH);
        addBond(c0, posO);
        addBond(posO, posH);
        addAtom([posO[0], posO[1] - 0.55, 0.55], 0.18, matLP);
      }

      // Pointer & Touch Rotation with Momentum Damping
      const domEl = molRenderer.domElement;
      const startDrag = (x, y) => { isDraggingMol = true; prevMouse = { x, y }; };
      const moveDrag = (x, y) => {
        if (!isDraggingMol) return;
        const dx = x - prevMouse.x;
        const dy = y - prevMouse.y;
        rotVel.y = dx * 0.012;
        rotVel.x = dy * 0.012;
        molGroup.rotation.y += rotVel.y;
        molGroup.rotation.x += rotVel.x;
        prevMouse = { x, y };
      };
      const endDrag = () => { isDraggingMol = false; };

      domEl.onmousedown = e => startDrag(e.clientX, e.clientY);
      window.onmousemove = e => moveDrag(e.clientX, e.clientY);
      window.onmouseup = endDrag;
      domEl.ontouchstart = e => { if (e.touches[0]) startDrag(e.touches[0].clientX, e.touches[0].clientY); };
      domEl.ontouchmove = e => { if (e.touches[0]) moveDrag(e.touches[0].clientX, e.touches[0].clientY); };
      domEl.ontouchend = endDrag;

      function animateMol() {
        molAnimId = requestAnimationFrame(animateMol);
        if (!isDraggingMol && molGroup) {
          molGroup.rotation.y += rotVel.y;
          molGroup.rotation.x += rotVel.x;
          rotVel.x *= 0.94;
          rotVel.y = rotVel.y * 0.94 + 0.004 * 0.06; // subtle idle spin
        }
        if (molRenderer && molScene && molCamera) {
          molRenderer.render(molScene, molCamera);
        }
      }
      animateMol();
    }

    /* -----------------------------------------------------------------------
       9. AMBIENT HERO 3D FLOATING MOLECULES (THREE.JS BACKGROUND)
       ----------------------------------------------------------------------- */
    function initAmbientScene() {
      const canvas = document.getElementById('ambient-canvas');
      if (!canvas || typeof THREE === 'undefined') return;

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.z = 16;

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

      const light1 = new THREE.DirectionalLight(0xffffff, 0.9);
      light1.position.set(6, 8, 10);
      scene.add(light1);
      scene.add(new THREE.AmbientLight(0xe0e7ff, 0.7));

      const palette = [0xc4b5fd, 0xbae6fd, 0xfed7aa, 0xa7f3d0];
      const clusters = [];

      for (let i = 0; i < 11; i++) {
        const g = new THREE.Group();
        const matMain = new THREE.MeshStandardMaterial({
          color: palette[i % palette.length],
          roughness: 0.4,
          transparent: true,
          opacity: 0.55
        });
        const core = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 16), matMain);
        g.add(core);

        // Two bonded satellite atoms (water/alcohol/ether motif)
        const sat1 = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), matMain);
        sat1.position.set(0.85, 0.45, 0);
        const sat2 = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), matMain);
        sat2.position.set(-0.85, 0.45, 0);
        g.add(sat1, sat2);

        g.position.set(
          (Math.random() - 0.5) * 26,
          (Math.random() - 0.5) * 16,
          (Math.random() - 0.5) * 8 - 3
        );
        g.userData = {
          vx: (Math.random() - 0.5) * 0.008,
          vy: (Math.random() - 0.5) * 0.008,
          rx: (Math.random() - 0.5) * 0.008,
          ry: (Math.random() - 0.5) * 0.008
        };
        scene.add(g);
        clusters.push(g);
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function tickAmbient() {
        requestAnimationFrame(tickAmbient);
        clusters.forEach(c => {
          c.position.x += c.userData.vx;
          c.position.y += c.userData.vy;
          c.rotation.x += c.userData.rx;
          c.rotation.y += c.userData.ry;
          if (Math.abs(c.position.x) > 15) c.userData.vx *= -1;
          if (Math.abs(c.position.y) > 9) c.userData.vy *= -1;
        });
        renderer.render(scene, camera);
      }
      tickAmbient();
    }

    function parseNotesToCards(text) {
      const lines = text.split(/\n+/).map(l => l.trim()).filter(Boolean);
      const cards = [];
      let i = 0;

      while (i < lines.length) {
        const line = lines[i];
        // Pattern 1: Q: ... followed by A: ...
        if (/^Q[:.\-]\s*/i.test(line) && i + 1 < lines.length && /^A[:.\-]\s*/i.test(lines[i + 1])) {
          const q = line.replace(/^Q[:.\-]\s*/i, '');
          const a = lines[i + 1].replace(/^A[:.\-]\s*/i, '');
          cards.push({
            id: `custom-${Date.now()}-${cards.length}`,
            tag: 'Custom Q&A',
            question: q,
            answer: `<p>${a}</p>`,
            tip: 'Auto-generated from your custom study notes.'
          });
          i += 2;
          continue;
        }

        // Pattern 2: Term - Definition or Term : Definition
        const splitMatch = line.match(/^([^:\-–]{3,70})\s*(?:[:\-–])\s*(.+)$/);
        if (splitMatch) {
          cards.push({
            id: `custom-${Date.now()}-${cards.length}`,
            tag: 'Custom Concept',
            question: `Explain: ${splitMatch[1].trim()}`,
            answer: `<p><strong>${splitMatch[1].trim()}:</strong> ${splitMatch[2].trim()}</p>`,
            tip: 'Auto-generated from your custom study notes.'
          });
          i += 1;
          continue;
        }

        // Pattern 3: Standalone paragraph / statement
        const words = line.split(' ');
        const headline = words.slice(0, 6).join(' ') + (words.length > 6 ? '...' : '');
        cards.push({
          id: `custom-${Date.now()}-${cards.length}`,
          tag: 'Note Snippet',
          question: `Key Concept Check: "${headline}"`,
          answer: `<p>${line}</p>`,
          tip: 'Auto-generated from your custom study notes.'
        });
        i += 1;
      }
      return cards;
    }

    function updateOcrStatus(text, pct, imgUrl = null) {

    async function processUploadedFile(file) {
      const name = file.name.toLowerCase();
      const mime = (file.type || '').toLowerCase();
      const textarea = document.getElementById('custom-notes-input');

      try {
        // 1. IMAGE FILES -> Tesseract.js OCR
        if (mime.startsWith('image/') || /\.(png|jpe?g|webp|bmp|gif|tiff?)$/.test(name)) {
          const objectUrl = URL.createObjectURL(file);
          updateOcrStatus(`Loading OCR engine for "${file.name}"...`, 8, objectUrl);

          if (typeof Tesseract === 'undefined') {
            throw new Error('OCR engine still loading. Check internet connection and try again.');
          }

          const worker = await Tesseract.createWorker('eng', 1, {
            logger: (m) => {
              if (m.status === 'recognizing text') {
                updateOcrStatus(`OCR Scanning "${file.name}"...`, 20 + m.progress * 78);
              } else {
                updateOcrStatus(`OCR: ${m.status}...`, 15);
              }
            }
          });
          const { data: { text } } = await worker.recognize(file);
          await worker.terminate();

          const cleaned = text.trim();
          textarea.value = textarea.value ? `${textarea.value}\n\n${cleaned}` : cleaned;
          updateOcrStatus(`OCR Complete! Extracted ${cleaned.length} characters from image.`, 100);
          showToast('Image text extracted via OCR!', 'bg-emerald-400');
        }

        // 2. PDF FILES -> PDF.js Text Extraction + Automatic Tesseract OCR Fallback for Scanned PDFs
        else if (mime === 'application/pdf' || name.endsWith('.pdf')) {
          if (typeof pdfjsLib === 'undefined') {
            throw new Error('PDF parser unavailable. Please check your connection.');
          }
          updateOcrStatus(`Reading PDF "${file.name}"...`, 10, false);
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          const totalPages = Math.min(pdf.numPages, 12);
          let extractedText = '';

          for (let p = 1; p <= totalPages; p++) {
            updateOcrStatus(`Extracting text from PDF page ${p}/${totalPages}...`, (p / totalPages) * 45);
            const page = await pdf.getPage(p);
            const content = await page.getTextContent();
            const pageStrings = content.items.map(item => item.str).join(' ');
            extractedText += pageStrings + '\n\n';
          }

          // If extracted text is very sparse (< 60 chars), treat as scanned PDF and run OCR on rendered pages
          if (extractedText.replace(/\s+/g, '').length < 60 && typeof Tesseract !== 'undefined') {
            updateOcrStatus('Scanned PDF detected! Running OCR on pages...', 50);
            const ocrPages = Math.min(pdf.numPages, 5);
            const worker = await Tesseract.createWorker('eng');
            let ocrResult = '';

            for (let p = 1; p <= ocrPages; p++) {
              updateOcrStatus(`OCR Scanning PDF page ${p}/${ocrPages}...`, 50 + (p / ocrPages) * 48);
              const page = await pdf.getPage(p);
              const viewport = page.getViewport({ scale: 1.8 });
              const canvas = document.createElement('canvas');
              canvas.width = viewport.width;
              canvas.height = viewport.height;
              const ctx = canvas.getContext('2d');
              await page.render({ canvasContext: ctx, viewport }).promise;
              const { data: { text } } = await worker.recognize(canvas);
              ocrResult += text + '\n\n';
            }
            await worker.terminate();
            extractedText = ocrResult;
          }

          const cleaned = extractedText.trim();
          textarea.value = textarea.value ? `${textarea.value}\n\n${cleaned}` : cleaned;
          updateOcrStatus(`Extracted ${cleaned.length} characters from PDF (${totalPages} page(s)).`, 100);
          showToast('PDF notes extracted successfully!', 'bg-emerald-400');
        }

        // 3. WORD DOCUMENTS (.docx) -> Mammoth.js
        else if (name.endsWith('.docx') || mime.includes('wordprocessingml')) {
          if (typeof mammoth === 'undefined') {
            throw new Error('DOCX parser unavailable.');
          }
          updateOcrStatus(`Extracting Word document "${file.name}"...`, 40, false);
          const arrayBuffer = await file.arrayBuffer();
          const result = await mammoth.extractRawText({ arrayBuffer });
          const cleaned = (result.value || '').trim();
          textarea.value = textarea.value ? `${textarea.value}\n\n${cleaned}` : cleaned;
          updateOcrStatus(`Extracted ${cleaned.length} characters from DOCX.`, 100);
          showToast('Word document text extracted!', 'bg-emerald-400');
        }

        // 4. ANY OTHER FORMAT (.txt, .md, .csv, .rtf, .json, etc.) -> FileReader Text Fallback
        else {
          updateOcrStatus(`Reading file "${file.name}"...`, 50, false);
          const text = await file.text();
          const cleaned = text.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '').trim();
          textarea.value = textarea.value ? `${textarea.value}\n\n${cleaned}` : cleaned;
          updateOcrStatus(`Loaded ${cleaned.length} characters from "${file.name}".`, 100);
          showToast(`Loaded "${file.name}"!`, 'bg-emerald-400');
        }
      } catch (err) {
        console.error(err);
        updateOcrStatus(`Note: ${err.message || 'Could not parse file automatically.'}`, 100, false);
        showToast('Error reading file—try pasting or another format.', 'bg-rose-500');
      }
    }

    function formatChemFormulas(str) {
      // Automatically subscript numbers following chemical symbols/parentheses
      return str.replace(/([A-Za-z\)])(\d+)/g, '$1<sub>$2</sub>');
    }

    function parseNotesToCards(text, maxCards = 15) {
      let rawChunks = text.split(/\n+/).map(l => l.replace(/^[•\-\*\d+\.]+\s*/, '').trim()).filter(l => l.length > 4);
      if (rawChunks.length === 1 && rawChunks[0].length > 180) {
        rawChunks = rawChunks[0].split(/(?<=[.?!])\s+/).map(s => s.trim()).filter(s => s.length > 12);
      }

      const cards = [];
      let i = 0;

      while (i < rawChunks.length && cards.length < maxCards) {
        const line = rawChunks[i];

        // 1. Explicit Q: ... followed by A: ...
        if (/^(?:Q|Question)[:.\-]\s*/i.test(line) && i + 1 < rawChunks.length && /^(?:A|Answer)[:.\-]\s*/i.test(rawChunks[i + 1])) {
          const q = line.replace(/^(?:Q|Question)[:.\-]\s*/i, '');
          const a = rawChunks[i + 1].replace(/^(?:A|Answer)[:.\-]\s*/i, '');
          cards.push({
            id: `custom-${Date.now()}-${cards.length}`,
            tag: 'Q&A Recall',
            question: formatChemFormulas(q),
            answer: `<p>${formatChemFormulas(a)}</p>`,
            tip: 'Extracted from your uploaded/OCR notes.'
          });
          i += 2;
          continue;
        }

        // 2. Chemical Reaction Equation Detection (contains ->, →, =>, ⇌)
        const rxnMatch = line.match(/^(.+?)\s*(?:->|→|=>|⇌)\s*(.+)$/);
        if (rxnMatch && rxnMatch[1].length >= 3 && rxnMatch[2].length >= 2) {
          cards.push({
            id: `custom-${Date.now()}-${cards.length}`,
            tag: '🧪 Chemical Reaction',
            question: `Predict the product(s) of this reaction:<br><span class="font-mono text-indigo-700 text-lg block mt-2">${formatChemFormulas(rxnMatch[1].trim())} ──▶ ?</span>`,
            answer: `
              <div class="font-mono text-sm sm:text-base font-bold p-3.5 rounded-xl bg-indigo-50/70 border border-indigo-100 text-slate-900">
                ${formatChemFormulas(rxnMatch[1].trim())} <span class="text-indigo-600">──▶</span> ${formatChemFormulas(rxnMatch[2].trim())}
              </div>
            `,
            tip: 'Detected automatically as a chemical equation from your notes.'
          });
          i += 1;
          continue;
        }

        // 3. Term - Definition or Term : Definition
        const splitMatch = line.match(/^([^:\-–]{3,65})\s*(?:[:\-–])\s*(.{8,})$/);
        if (splitMatch) {
          const term = splitMatch[1].trim();
          const def = splitMatch[2].trim();
          cards.push({
            id: `custom-${Date.now()}-${cards.length}`,
            tag: 'Key Concept',
            question: `Define / Explain: <span class="text-indigo-700">${formatChemFormulas(term)}</span>`,
            answer: `<p><strong>${formatChemFormulas(term)}:</strong> ${formatChemFormulas(def)}</p>`,
            tip: 'Extracted from your uploaded/OCR notes.'
          });
          i += 1;
          continue;
        }

        // 4. General Paragraph / OCR Sentence -> Active Recall Concept Card
        const words = line.split(/\s+/);
        const promptPreview = words.slice(0, 7).join(' ') + (words.length > 7 ? '...' : '');
        cards.push({
          id: `custom-${Date.now()}-${cards.length}`,
          tag: 'OCR Note Concept',
          question: `Recall the key chemistry concept for:<br><span class="text-indigo-700 font-semibold text-lg">"${formatChemFormulas(promptPreview)}"</span>`,
          answer: `<p>${formatChemFormulas(line)}</p>`,
          tip: 'Tip: You can edit extracted text anytime before generating cards.'
        });
        i += 1;
      }

      return cards;
    }
